name: Daily ingest

on:
  schedule:
    - cron: "17 11 * * *" # daily, 11:17 UTC
  workflow_dispatch:
    inputs:
      pages:
        description: Max pages per search term (50 postings per page)
        default: "5"
      max_days_old:
        description: How many days back to look (use 30 for a first backfill)
        default: "3"

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is not set"; exit 1; fi
          python -m app.check_db
      - name: Pull new postings from Adzuna
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: >-
          python -m app.ingest
          --pages "${{ inputs.pages || '5' }}"
          --max-days-old "${{ inputs.max_days_old || '3' }}"
